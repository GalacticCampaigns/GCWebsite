name: Automated Log Update

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour. Change to '0 0 * * *' for daily.
  workflow_dispatch: # Allows you to run it manually from the Actions tab
    inputs:
      dry_run:
        description: 'Dry Run Mode (Skip pushing changes)'
        type: boolean
        required: false
      force_audit:
        description: 'Force pull audit of all history'
        type: boolean
        required: false

jobs:
  update-logs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Fetch all history for git operations
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Handle SSH Aliases (Public Repos)
      run: |
        git config --global url."https://github.com/".insteadOf "git@github.com-alicia86e:"   
        
    - name: Run Pull Logs
      run: |
        ARGS=""
        if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS -d"; fi
        if [ "${{ github.event.inputs.force_audit }}" = "true" ]; then ARGS="$ARGS -f"; fi
        python -m scripts.pull_logs $ARGS
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}        
        WEBSITE_REPO: ${{ vars.WEBSITE_REPO }} # Or replace with your raw URL string if not using secrets
        
    - name: Upload Forge Report
      uses: actions/upload-artifact@v4
      with:
        name: forge-report
        path: forge_report_latest.log
        
    - name: Send Email Report
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com # Replace with your SMTP server
        server_port: 465
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "Chronicle Forge Report"
        to: ${{ vars.SMTP_TO }} # Replace with your email
        from: "Forge Bot <noreply@example.com>"
        body: "Attached is the latest report from the Chronicle Forge."
        attachments: forge_report_latest.log
